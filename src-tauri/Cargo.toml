[package]
name = "clipboard-linux"
version = "0.1.1"
description = "ClipKeeper System Clipboard Manager for Linux ARM64"
authors = ["ClipKeeper Team"]
edition = "2021"

[lib]
name = "clipboard_linux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
arboard = "3.4"
image = "0.25"
base64 = "0.22"
sha2 = "0.10"
once_cell = "1.20"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
